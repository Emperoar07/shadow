name: Deploy Devnet

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only (skip on-chain deploy/init)"
        required: true
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOLANA_CLI_VERSION: "v2.3.0"
      ANCHOR_VERSION: "0.32.1"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_CLI_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI (AVM)
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked
          avm install ${ANCHOR_VERSION}
          avm use ${ANCHOR_VERSION}
          anchor --version

      - name: Install Arcium CLI
        run: |
          curl -sSL https://install.arcium.com | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          arcium --version

      - name: Install JS deps
        run: npm install

      - name: Configure Solana wallet + devnet
        env:
          SOLANA_WALLET_KEYPAIR_JSON: ${{ secrets.SOLANA_WALLET_KEYPAIR_JSON }}
        run: |
          if [ -z "${SOLANA_WALLET_KEYPAIR_JSON}" ]; then
            echo "Missing secret: SOLANA_WALLET_KEYPAIR_JSON"
            exit 1
          fi

          mkdir -p "$HOME/.config/solana"
          printf '%s' "${SOLANA_WALLET_KEYPAIR_JSON}" > "$HOME/.config/solana/id.json"
          chmod 600 "$HOME/.config/solana/id.json"

          solana config set --url devnet --keypair "$HOME/.config/solana/id.json"
          solana address
          solana balance || true

      - name: Top up deployer SOL (best effort)
        run: |
          set +e
          WALLET="$(solana address)"
          echo "Wallet: ${WALLET}"

          # Try direct airdrop to deployer wallet.
          for AMOUNT in 5 2 1; do
            echo "Attempting direct airdrop ${AMOUNT} SOL..."
            solana airdrop "${AMOUNT}" "${WALLET}" --url https://api.devnet.solana.com && break
            sleep 3
          done

          # Try a fresh temporary wallet and forward funds to deployer.
          TMP_KEYPAIR="$(mktemp)"
          solana-keygen new --no-bip39-passphrase -o "${TMP_KEYPAIR}" --force --silent
          TMP_WALLET="$(solana-keygen pubkey "${TMP_KEYPAIR}")"
          echo "Temporary wallet: ${TMP_WALLET}"

          for ATTEMPT in 1 2 3 4 5; do
            echo "Attempting temp-wallet airdrop (attempt ${ATTEMPT})..."
            solana airdrop 2 "${TMP_WALLET}" --url https://api.devnet.solana.com && break
            sleep 3
          done

          solana balance "${TMP_WALLET}" || true
          solana transfer \
            --from "${TMP_KEYPAIR}" \
            --fee-payer "${TMP_KEYPAIR}" \
            --allow-unfunded-recipient \
            "${WALLET}" 1.8 --no-wait || true

          echo "Final deployer balance:"
          solana balance || true

      - name: Build only (dry run)
        if: ${{ inputs.dry_run == true }}
        run: |
          # Build confidential circuits and require generated artifacts.
          arcium build
          ls -la build || true
          test -f build/open_position.arcis
          test -f build/close_position.arcis
          test -f build/check_liquidation.arcis
          # Build the on-chain Anchor program
          anchor build

      - name: Deploy + initialize devnet
        if: ${{ inputs.dry_run == false }}
        run: |
          arcium build
          ls -la build || true
          test -f build/open_position.arcis
          test -f build/close_position.arcis
          test -f build/check_liquidation.arcis
          anchor build
          npx --yes ts-node scripts/deploy-devnet.ts
          if [ -f app/.env.local ]; then
            echo "### Devnet Outputs" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            grep '^NEXT_PUBLIC_' app/.env.local >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: arcium-build-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            build/open_position.arcis
            build/close_position.arcis
            build/check_liquidation.arcis
            target/idl/shadowperp.json
            app/.env.local
