[workspace]
members = [
    "programs/shadowperp",
    "encrypted-ixs",
]
resolver = "2"

[workspace.metadata.solana]
tools-version = "v1.53"

[profile.release]
overflow-checks = true
lto = false
codegen-units = 16

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Pin blake3 to a version compatible with Solana platform-tools Cargo 1.75.
# blake3 >= 1.6 uses edition2024 which requires Cargo >= 1.85.
# Remove this patch once Solana platform-tools ships with Cargo >= 1.85.
[patch.crates-io]
blake3 = { path = "vendor/blake3-1.5.5" }
toml_parser = { path = "vendor/toml_parser-1.1.0+spec-1.1.0" }
base64ct = { path = "vendor/base64ct-1.8.3" }
toml_datetime = { path = "vendor/toml_datetime-1.1.0+spec-1.1.0" }
toml_edit = { path = "vendor/toml_edit-0.25.8+spec-1.1.0" }
unicode-segmentation = { path = "vendor/unicode-segmentation-1.13.2" }
wincode = { path = "vendor/wincode-0.4.9" }
wincode-derive = { path = "vendor/wincode-derive-0.4.3" }


