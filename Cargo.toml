[workspace]
members = [
    "programs/shadowperp",
    "encrypted-ixs"
]
resolver = "2"

[workspace.metadata.solana]
tools-version = "v1.48"

[profile.release]
overflow-checks = true
lto = false
codegen-units = 16

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[patch.crates-io]
proc-macro2 = { git = "https://github.com/arcium-hq/proc-macro2.git" }
