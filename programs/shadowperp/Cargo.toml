[package]
name = "shadowperp"
version = "0.1.0"
description = "ShadowPerp - Private Perpetual Futures on Arcium"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "shadowperp"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
arcium-anchor = "0.8.3"
arcium-macros = "0.8.3"
bytemuck = { version = "1.14", features = ["derive"] }
solana-instruction = "=2.3.3"
